apiVersion: batch/v1
kind: Job
metadata:
  name: dgaddy-gt2n-fastercap-batch
  namespace: vlsida
  labels:
    app: gt2n-fastercap
    project: gt2n
    user: dgaddy
spec:
  completions: 120
  parallelism: 120
  completionMode: Indexed
  ttlSecondsAfterFinished: 86400
  backoffLimitPerIndex: 2
  maxFailedIndexes: 3
  template:
    metadata:
      labels:
        app: gt2n-fastercap
        project: gt2n
        user: dgaddy
    spec:
      restartPolicy: Never
      containers:
      - name: fastercap
        image: docker.io/openroad/orfs:26Q2
        command: ["/bin/bash", "/scripts/entrypoint.sh"]
        env:
        - name: JOB_COMPLETION_INDEX
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
        - name: N_SHARDS
          value: "120"
        - name: PARALLEL
          value: "4"
        resources:
          requests:
            cpu: "32"
            memory: "64Gi"
          limits:
            cpu: "32"
            memory: "64Gi"
        volumeMounts:
        - name: entrypoint
          mountPath: /scripts
      volumes:
      - name: entrypoint
        configMap:
          name: gt2n-fastercap-entrypoint
